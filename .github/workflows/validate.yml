name: Validate Code
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: Offline self test
        run: python src/selftest.py
      - name: Unit and workflow regression tests
        run: python -m unittest discover -s tests -v
